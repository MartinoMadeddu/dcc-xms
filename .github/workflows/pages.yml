# Publishes the website in site/ to GitHub Pages.
#
# One-time setup on GitHub: Settings > Pages > Source: "GitHub Actions".
# After that, every push to main that touches the site, the screenshots or
# the artwork republishes it.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: sh site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
